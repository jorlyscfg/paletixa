server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location = /index.html {
    add_header Cache-Control 'no-store';
  }

  location = /manifest.webmanifest {
    try_files $uri =404;
    add_header Cache-Control 'no-cache';
  }

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control 'no-cache';
  }

  location ~ ^/workbox-.*\.js$ {
    try_files $uri =404;
    add_header Cache-Control 'no-cache';
  }

  location ~* \.(?:js|css|ico|svg|png|jpg|jpeg|webp|avif|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
