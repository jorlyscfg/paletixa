schema: spec-driven

context: |
  Product context: PRD_PALETIXA.md defines a single-client, multi-branch operations platform.
  Frontend: Bun package workflow, Vite 8, React 19, TypeScript 5.9, and Tailwind CSS 4.
  Architecture: minimal Vite SPA; src/main.tsx bootstraps App.tsx and src/index.css supplies global Tailwind styles.
  Backend: InsForge Postgres BaaS for database and backend capabilities; credentials remain in local env/config only.
  UI baseline: mobile-first, semantic, keyboard-accessible, and LAN-capable development server.
  Product implementation has not started; this configuration records context only.

strict_tdd: false

testing:
  detected_on: "2026-08-13"
  strict_tdd: false
  reason: "No test runner, test configuration, test files, or coverage tool is installed."
  test_runner:
    available: false
    framework: null
    command: null
  layers:
    unit:
      available: false
      tool: null
    integration:
      available: false
      tool: null
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: true
      command: "bun run lint"
    type_checker:
      available: true
      command: "bun run build"
    formatter:
      available: false
      command: null

delivery:
  execution_mode: auto
  artifact_store: hybrid
  delivery_strategy: auto-chain
  review_budget_lines: 400

rules:
  proposal:
    - Use PRD_PALETIXA.md as product context; do not treat it as an implementation plan.
    - Include a rollback plan for risky backend, state-transition, or data changes.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
    - Model authorization, idempotency, and atomicity for money or branch-unit mutations.
  design:
    - Preserve the Vite SPA boundary and document InsForge schema, RLS, and transaction decisions.
    - Use explicit roles and capabilities; never use email-prefix authorization.
  tasks:
    - Group work into independently reviewable units and auto-chain work forecast above 400 changed lines.
    - Add a test capability before requiring TDD for a change.
  apply:
    guidelines:
      - Follow the existing TypeScript, ESLint, Tailwind, and accessible semantic UI patterns.
      - Use the InsForge SDK skill for client integration and the InsForge CLI skill for backend infrastructure.
      - Never read, commit, or expose .insforge/project.json or credential values.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "bun run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
